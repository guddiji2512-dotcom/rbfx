name: Build rbfx Android APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          for dir in "$SDK_ROOT"/cmdline-tools/*/bin "$SDK_ROOT"/cmdline-tools/bin "$SDK_ROOT"/tools/bin; do
            if [ -d "$dir" ]; then
              echo "$dir" >> $GITHUB_PATH
            fi
          done
          ls -la "$SDK_ROOT" || true
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found, using existing SDK at $SDK_ROOT"
          fi

      - name: Install build tools (CMake & Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Inspect project structure
        run: |
          ls -la
          find . -maxdepth 3 -name "CMakeLists.txt" -o -name "gradlew"

      - name: Build Android project
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            (cd android && ./gradlew assembleDebug)
          else
            echo "Gradle wrapper not found in root or ./android"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbfx-android-debug-apk
          path: "**/*.apk"
